# Labeled synthetic inbox for the communications/CRM scripts (mail_classify F1, gmail_pull
# extraction, prospects ingest). Every person, company domain and message here is invented;
# ATS / scheduling / assessment vendor domains are the real sender domains those vendors use.
#
# Fields: id, label (expected), at (ISO with offset), from, subject, body.
# Optional: to, cc, reply_to, headers{}, gmail_labels[], thread (fixture id whose thread this
# joins), in_reply_to (fixture id), html (add a text/html alternative), html_only,
# calendar{start,end,tz,summary,organizer}, attachments[filename].
#
# Label semantics (the contract the classifier is scored against):
#   recruiter_outreach       recruiter / sourcer / talent person (in-house or agency) reaching out
#   founder_outreach         a founder / co-founder writing personally about joining or a role
#   hiring_manager_outreach  an engineering manager / head of / director / VP about their own team
#   referral_intro           an introduction to someone, or an offer / confirmation of a referral
#   ats_confirmation         automated "we received your application"
#   ats_assessment           online assessment, coding test or take-home
#   interview_invite         invitation to interview or to the next round (asks to schedule)
#   interview_scheduling     logistics: calendar invites, confirmations, reschedules
#   rejection | offer | job_alert | newsletter | networking | other
#   suspected_scam           asks for identity documents, bank or payment details, a fee or an
#                            equipment purchase, or offers a job with no interview process; wins over offer

