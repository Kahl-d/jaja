[project]
name = "job-search-mcp"
version = "0.1.0"
description = "Job-search department MCP server: records, CRM and drafts for every engine; never sends"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6",
]

[project.scripts]
job-search-mcp = "job_search_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_search_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
