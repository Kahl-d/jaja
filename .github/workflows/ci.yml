name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      JOB_AGENCY_DEMO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pyyaml pytest

      # Demo data only: no private data folder and no config exist on the runner.
      - name: Doctor on the demo data
        run: python scripts/doctor.py --data examples/demo-data

      - name: Tests
        run: python -m pytest scripts/tests -m "not real_records and not workspace" -q -p no:cacheprovider
        env:
          JOB_AGENCY_RUNTIME: ${{ runner.temp }}/job-agency-runtime

      # The private deny-list is built from the owner's own data and never leaves their machine, so CI runs only the
      # pattern checks (emails, home paths, tokens, forbidden folders and file types) plus gitleaks below.
      - name: Leak check (patterns)
        run: python tools/leak_check.py --no-denylist --no-gitleaks

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
