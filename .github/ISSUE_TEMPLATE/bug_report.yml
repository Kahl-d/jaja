name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please use synthetic or redacted data: never paste a real resume, message, name or token.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran, ideally on the demo data (`./install.sh --demo --yes`).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python3 scripts/doctor.py`
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS or Linux version, Python version, Claude Code version
