name: Feature request
description: Suggest an agent, skill, script or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A new agent or skill, a script change, a connector. Say which approvals or gates it should respect.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
