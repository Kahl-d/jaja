# Template: templates/automation.yaml · Contract: schemas/automation.yaml
# Interview (/jaja:new-automation): which event? (SessionEnd | SessionStart | PreToolUse |
# FileChanged(path) | inbox:new(type) | routine:done(name) | webhook) under what condition?
# what runs, and is it deterministic? tier? Hook-backed automations are compiled into the
# hooks file by sync; inbox- and routine-backed ones are evaluated by the sweep.
name: <automation-slug>
trigger: {event: <SessionEnd | SessionStart | PreToolUse | FileChanged | inbox:new | routine:done | webhook>}
condition: "<expression, e.g. cwd within the agency data folder>"
action: <script:<path> | skill:agency:<name>>
tier: <T0|T1|T2>
enabled: false
