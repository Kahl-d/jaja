# Job platform registry for the job-search department. Owner: platform-scout (roles/platform-scout.md);
# research and sources: research/job-platforms-2026.md. One entry per platform where the owner could find a
# job. sources.yaml lists the pipeline's channels; this file says, per platform, what the terms allow,
# how jobs reach jobs/, and what the platform yields.
#
#   access         api          a public API or feed whose terms allow this personal use; a script polls it
#                  rss          a public RSS feed whose terms allow it
#                  email-alert  the platform's own job-alert mail to the owner's Gmail, parsed by
#                               scripts/job_alerts.py from the classified harvest (never by visiting the site)
#                  browser      an agent may read pages the owner opens, with him present, at human pace
#                               (skill browser-job-search); never logs in, never clicks apply or submit
#                  manual       the owner reads the site himself; the agent only records what he reports
#                               (scripts/jobs_manual.py). Used where the terms name AI or intelligent agents.
#   control        how the agency reaches it: connector (an official Claude connector
#                  used in the owner's sessions), api (a script polls an allowed API or feed), alert-mail (his alert mail,
#                  parsed), browser-with-owner (an agent reads pages he opens, with him present), manual (he reads it;
#                  agents only record what he reports, or the channel is retired or blocked)
#   browser_pacing_s  seconds between browser reads of this site (default and minimum 60; scripts/browser_pace.py checks
#                  it before every page; a block page is recorded there and stops every lane)
#   inbox_senders: addresses or domains of the portal's non-alert mail (messages, application confirmations,
#                  relays); with alert_senders they are how mail and touches are tagged `portal: <id>`
#                  (scripts/portal_registry.py portal_for_sender)
#   presence: the owner's presence on the portal:
#                  kind, priority, terms note, account {state, evidence, email (never a secret)}, profile, resume,
#                  last_updated, next_refresh, inbox {email_senders, in_app, classifier, last_swept}, alerts, next_step,
#                  optional decision and linked. Read by presence_check.py and outbox.py through portal_registry.py.
#                  Surfaces that are not job platforms sit in the top-level presence_surfaces (same fields plus id, name);
#                  presence_base_resume is the base the presence checks compare against.
#   adapter        the script that turns the channel into job records, or null
#   alert_senders  addresses or domains whose job_alert mail belongs to this platform (job_alerts.py reads
#                  this list; an unmapped sender goes to the review list, never into jobs/)
#   tos            quote (the deciding clause, under 15 words), url, read_on; verified: yes (read on the
#                  platform's own page) or no (the page
#                  refused automated reading; the quote comes from a secondary source or is missing)
#   agent_terms    what the terms say about agents, set from the granting or forbidding clause:
#                  none          nothing beyond generic bot or scraping bans
#                  names-agents  they name AI agents or automated agents (also: the terms could not be read)
#                  gateway-only  the only agent access is a credentials or auto-apply gateway
#                  bars-bots     the terms bar bots or automation on the platform itself
#                                (clause reference); allowed active or probation because the channel is the owner's own alert mail and the
#                                apply is the owner's click or the employer's site (charter section 7), never the platform
#                  anything but none is never probation or active (platform_yield.py --check errors)
#   status         active     wired and proven by yield at a monthly review
#                  probation  wired or set up, not proven yet; judged at the monthly platform watch
#                  manual     no agent reads the site: the owner reads it himself (his alert mail is still parsed);
#                             also a retired alert platform
#                  blocked    not used (terms, shutdown or scam risk); the reason is in notes
#   setup_priority P0 tomorrow, P1 this week, P2 later, none (nothing for the owner to do)
#   alerts_on      the date the owner confirmed his alerts on this platform (skill setup-job-alerts); null until then,
#                  and null again once he confirms he deleted them (retirement; notes keep that date)
#   proposed       only while a monthly-watch status change waits for job-lead's Monday review:
#                  {from: <the status before>, date: <watch date>}; dropped once ratified, `from` restored on a
#                  revert (platform_yield.py --check warns after that Monday)
# Top level `ignored_senders:` (after the platforms): {sender (address or domain), why, decided, kind} for senders never
# mapped (a re-aggregator, noise); job_alerts.py ledgers their mail `ignored` once instead of leaving it unmapped. kind
# (platform_yield.py --check requires it): job-alert (real job mail we chose not to parse), marketing (a
# platform's or organisation's promotional or news mail) or noise (automated pings with nothing to act on).
#   yield          trailing 30 days by first_seen, written only by `python3 scripts/platform_yield.py --write`:
#                  fetched (records naming the platform, including seen_on), new (first found here, not a
#                  duplicate), queued (reached queued or later), applied, interviews (screen or later)

# Starter registry: the public platforms the pipeline and job_alerts.py know. Terms were read on the dates shown; re-read before
# relying on a quote. `yield` and `last_reviewed` are written by scripts/platform_yield.py --write and the monthly review.
platforms:
  - id: company-ats
    name: Company ATS boards (Greenhouse, Lever, Ashby, Workday)
    url: https://boards-api.greenhouse.io/v1/boards/{token}/jobs
    access: [api]
    control: api
    adapter: scripts/fetch_ats.py
    alert_senders: []
    tos: {quote: 'Job Board data is publicly available, so authentication is not required', url: 'https://docs.greenhouse.io/job-board.html', read_on: 2026-09-25, verified: 'yes'}
    agent_terms: none
    sponsorship_filter: none on the boards; fit_gates.py reads the JD and h1b_lookup.py adds LCA history
    account_needed: false
    alert_setup: None. A script polls the platform's API from the pipeline.
    setup_priority: none
    status: probation
    yield: {fetched: 0, new: 0, queued: 0, applied: 0, interviews: 0}
